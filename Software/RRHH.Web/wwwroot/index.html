<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122837">
  <title>Gestión de RRHH</title>

  <link rel="icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
  <script src="/pwa.js" defer></script>
</head>
<body>
  <a class="saltar" href="#vista">Ir al contenido</a>
  <header class="barra">
    <button id="abrir-menu" class="boton-menu" type="button" aria-controls="menu" aria-label="Abrir o cerrar el menú">Menú</button>
    <div class="marca"><strong>RRHH</strong><span>Gestión de asistencia</span></div>
    <div class="sesion"><span id="usuario"></span><button id="salir" type="button" hidden>Cerrar sesión</button></div>
  </header>
  <p id="mensaje" role="status" aria-live="polite"></p>

  <section id="acceso" class="acceso" hidden>
    <h1>Iniciar sesión</h1>
    <p>Ingrese con su usuario de RRHH. Cada rol ve solo los módulos que tiene habilitados.</p>
    <form id="login">
      <label>Usuario RRHH<input name="login" autocomplete="username" maxlength="128" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
      <button>Entrar</button>
    </form>
  </section>

  <div id="aplicacion" class="aplicacion" hidden>
    <nav id="menu" class="menu" aria-label="Módulos del sistema"></nav>
    <main id="vista" class="vista" tabindex="-1"></main>
  </div>
</body>
</html>
