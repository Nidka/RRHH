services:
  web:
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: ${RRHH_WEB_ENVIRONMENT:-Production}
      RRHH_WEB_POSTGRES: ${RRHH_WEB_POSTGRES:?Configure la conexión PostgreSQL en .env}
      RRHH_WEB_ROLES: ${RRHH_WEB_ROLES:-}
      RRHH_WEB_ROLES_AUTOCONSULTA: ${RRHH_WEB_ROLES_AUTOCONSULTA:-}
      RRHH_WEB_ROLES_AUSENCIAS: ${RRHH_WEB_ROLES_AUSENCIAS:-}
      RRHH_WEB_ROLES_HORARIOS: ${RRHH_WEB_ROLES_HORARIOS:-}
      RRHH_WEB_ROLES_MOTIVOS: ${RRHH_WEB_ROLES_MOTIVOS:-}
      RRHH_WEB_ROLES_ASISTENCIA: ${RRHH_WEB_ROLES_ASISTENCIA:-}
      RRHH_WEB_ROLES_VACACIONES: ${RRHH_WEB_ROLES_VACACIONES:-}
      RRHH_WEB_ROLES_PERMISOS: ${RRHH_WEB_ROLES_PERMISOS:-}
      RRHH_VACACIONES_DIAS_ANUALES: ${RRHH_VACACIONES_DIAS_ANUALES:-30}
    ports:
      - "127.0.0.1:${RRHH_WEB_PORT:-8080}:8080"
    restart: unless-stopped
